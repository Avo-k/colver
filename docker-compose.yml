services:
  colver:
    build: .
    ports:
      - "8002:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - colver-db:/data/colver
    environment:
      - ROOT_PATH=${ROOT_PATH:-/colver}
      - COLVER_UPDATE_MODEL=1
      - COLVER_MODEL_PATH=/app/models/dmc_35.bin
      - COLVER_DB_PATH=/data/colver/colver.db
    restart: unless-stopped

volumes:
  colver-db:
