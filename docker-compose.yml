services:
  colver:
    build: .
    ports:
      - "8002:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - colver-db:/data/colver
      # Les backups sortent du volume de la base : leur raison d'être est de
      # survivre à la perte de `colver-db`.
      - ./backups:/backups
    environment:
      - ROOT_PATH=${ROOT_PATH:-/}
      - COLVER_UPDATE_MODEL=1
      - COLVER_MODEL_PATH=/app/models/dmc_50.bin
      - COLVER_DB_PATH=/data/colver/colver.db
      - COLVER_BACKUP_DIR=/backups
      # Sidecar d'inférence GPU playgen (`playgen_gpu_server` sur une machine
      # CUDA). Vide par défaut = désactivé : IS-DD échantillonne alors des
      # mondes contraints-uniformes et le dit dans ses stats. Renseigner
      # l'URL du sidecar dans le `.env` du déploiement — surtout pas ici, une
      # IP de LAN en dur enverrait les requêtes de n'importe quel cloneur
      # vers une machine au hasard de *son* réseau.
      - COLVER_PLAYGEN_GPU_URL=${COLVER_PLAYGEN_GPU_URL:-}
      # Ce déploiement *attend* un sidecar : sans ce drapeau, « pas de playgen »
      # est indiscernable d'un choix (une machine de dev sans GPU est normale),
      # et /health n'a aucune raison de s'en émouvoir. Avec, un sidecar absent
      # ou injoignable passe le service en `degraded`. La prod a tourné plus
      # d'un jour sur des mondes uniformes faute de cette distinction.
      - COLVER_REQUIRE_SIDECAR=${COLVER_REQUIRE_SIDECAR:-}
      # IP (ou CIDR) du reverse-proxy autorisé à poser X-Forwarded-* : en
      # Docker, Caddy n'arrive pas en 127.0.0.1 mais par la passerelle du
      # bridge. Sans ça, toutes les limites par IP retombent sur l'IP du proxy.
      # Derrière Cloudflare en mode proxy, il faut EN PLUS que Caddy transmette
      # la vraie IP cliente (CF-Connecting-IP → X-Forwarded-For, ou plages CF
      # en trusted_proxies) et ajouter ces plages ici — sinon les limites par
      # IP comptent par edge Cloudflare, partagé entre visiteurs.
      - COLVER_FORWARDED_ALLOW_IPS=${COLVER_FORWARDED_ALLOW_IPS:-172.16.0.0/12}
      # Origine publique : c'est elle qui fabrique les liens de réinitialisation
      # de mot de passe, **jamais** `request.url` — derrière Cloudflare puis
      # Caddy, ce serait `localhost:8000` et le lien ne mènerait nulle part.
      - COLVER_PUBLIC_URL=${COLVER_PUBLIC_URL:-https://colver.net}
      # Envoi de courriel (réinitialisation de mot de passe). Valeurs dans le
      # `.env` du déploiement, comme l'URL du sidecar — une clé SMTP n'a rien à
      # faire dans un dépôt public. Vide = pas d'envoi : `mail.send` journalise
      # alors le lien au lieu de l'expédier, et la demande aboutit quand même
      # (cf. `web/mail.py`), ce qui garde la fonctionnalité utilisable en
      # développement et rend une vraie panne d'envoi visible.
      - COLVER_SMTP_HOST=${COLVER_SMTP_HOST:-}
      - COLVER_SMTP_PORT=${COLVER_SMTP_PORT:-587}
      - COLVER_SMTP_USER=${COLVER_SMTP_USER:-}
      - COLVER_SMTP_PASSWORD=${COLVER_SMTP_PASSWORD:-}
      - COLVER_SMTP_TLS=${COLVER_SMTP_TLS:-starttls}
      - COLVER_MAIL_FROM=${COLVER_MAIL_FROM:-}
    restart: unless-stopped

volumes:
  colver-db:
