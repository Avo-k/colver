services:
  colver:
    build: .
    ports:
      - "8002:8000"
    volumes:
      - ./models:/app/models
      - ./data:/app/data
      - colver-db:/data/colver
    environment:
      - ROOT_PATH=${ROOT_PATH:-/}
      - COLVER_UPDATE_MODEL=1
      - COLVER_MODEL_PATH=/app/models/dmc_35.bin
      - COLVER_DB_PATH=/data/colver/colver.db
      # Sidecar d'inférence GPU playgen (3090 de l'hôte moxxi). Fallback CPU
      # automatique si absent/injoignable — vide = désactivé.
      - COLVER_PLAYGEN_GPU_URL=${COLVER_PLAYGEN_GPU_URL:-http://192.168.1.23:8003}
    restart: unless-stopped

volumes:
  colver-db:
