# Lefant v2: smoothing=0.20, decay=0.8, no dominance
[bid]
strategy = "nn"
model = "models/bid_v2/bid_nn_final.bin"
hidden = 512

[play]
method = "smart_is_dd"
time_ms = 50
determinizations = 20
elephant_memory = true
elephant_use_dominance = false
elephant_smoothing = 0.20
elephant_decay = 0.8

[belief]
model = "models/belief_v3.bin"
use_hard_constraints = true
