# Bid v2 + DMC for first 5 tricks, IS-DD solver for last 3
[bid]
strategy = "nn"
model = "models/bid_v2/bid_nn_final.bin"
hidden = 512

[play]
method = "dmc_then_dd"
model = "models/dmc_35.bin"
switch_at = 5
time_ms = 50
determinizations = 20

[belief]
model = "models/belief_v3.bin"
use_hard_constraints = true
