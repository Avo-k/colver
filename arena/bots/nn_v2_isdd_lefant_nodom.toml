# Dédéléfant (no dominance): IS-DD with elephant memory, hard filter only
# No soft dominance penalty — only eliminates particles where player didn't have the played card
[bid]
strategy = "nn"
model = "models/bid_v2/bid_nn_final.bin"
hidden = 512

[play]
method = "smart_is_dd"
time_ms = 50
determinizations = 20
elephant_memory = true
elephant_use_dominance = false
elephant_smoothing = 0.05

[belief]
model = "models/belief_v3.bin"
use_hard_constraints = true
