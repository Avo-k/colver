# Le joueur qui produit le corpus de donnes complètes (`gen_games_isdd`).
#
# C'est la référence du projet — bid v6 + IS-DD sur mondes playgen — figée ici
# pour que « qui a joué ce corpus » soit une question à réponse unique. Le
# nombre de mondes se règle en ligne de commande (`--dets`), pas ici : c'est le
# paramètre qu'on fait varier, et le laisser dans le TOML inviterait à générer
# deux moitiés de corpus avec deux joueurs différents sans que ça se voie.
[bid]
strategy = "nn"
model = "models/bid_v6_isdd_resume/bid_nn_final.bin"
hidden = 512
score_aware = true

[play]
method = "isdd"
time_ms = 0          # mode compte : `determinizations` mondes exactement
determinizations = 40
objective = "deal_score"
parallel = false     # débit, pas latence — cf. l'en-tête de gen_games_isdd.rs

[worlds]
source = "sidecar"
fallback = "strict"  # un corpus à moitié en mondes uniformes n'est pas un corpus
