# `web_dede`, mais qui maximise les **points cartes** au lieu du score de donne.
#
# C'est le bras de contrôle, pas le bot de prod : `deal_score` est le défaut
# depuis le 2026-08-03 et c'est `web_dede` qui reflète le web. Ce fichier existe
# pour qu'un A/B garde son autre bras — seule différence, `objective` ; mêmes
# poids, même budget, mêmes mondes, même plafond.
#
# Ce que l'objectif « points cartes » rate (`engine/scoring.rs`, contrat de
# valeur V, points cartes du preneur x) : l'écart N-S − E-O vaut -(162 + V)
# constant sous le seuil, 2x+V-162 au-dessus, avec une marche de 4V entre les
# deux. Maximiser l'espérance de points cartes est une approximation linéaire de
# cette marche — correcte au-dessus du seuil, et fausse en dessous où un point
# carte de plus vaut exactement zéro. Il ignore aussi la belote, qui **déplace
# le seuil** de 20 points, et ne distingue pas « faire chuter l'adversaire » de
# « lui prendre quelques points cartes ».
#
# ⚠️ Son `card_scores` est en points cartes (0-252), pas en écart de score.
# Ne pas comparer ses valeurs à celles de `web_dede` : deux échelles.
[bid]
strategy = "nn"
model = "models/bid_v6_isdd.bin"
hidden = 512

[play]
method = "isdd"
time_ms = 1000
determinizations = 20
max_worlds = 256
objective = "card_points"

[worlds]
source = "sidecar"
batch = 256
fallback = "strict"

[belief]
model = "models/belief_v4_fix_v2.bin"
