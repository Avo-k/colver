# IS-DD with play dominance inference, factor=0.20 (very aggressive)
[bid]
strategy = "nn"
model = "models/bid_v2/bid_nn_final.bin"
hidden = 512

[play]
method = "smart_is_dd"
time_ms = 50
determinizations = 20
dominance_factor = 0.20

[belief]
model = "models/belief_v3.bin"
use_hard_constraints = true
