# Playgen A/B: IS-DD 10 dets, 100% playgen worlds
[bid]
strategy = "nn"
model = "models/bid_v6_isdd_resume/bid_nn_final.bin"
hidden = 512
score_aware = true

[play]
method = "smart_is_dd"
determinizations = 10
time_ms = 0

[worlds]
source = "playgen"   # in-process CPU sampler
model = "models/playgen/playgen_final.bin"
temperature = 1.0
