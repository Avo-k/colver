# Prix de l'imprévisibilité : "random" tire au sort parmi les cartes DD-équivalentes
# ("random") ou seulement parmi les moins chères d'entre elles ("random_cheap").
[bid]
strategy = "nn"
model = "models/bid_v6_isdd_resume/bid_nn_final.bin"
hidden = 512
score_aware = true

[play]
method = "oracle_dd"
tiebreak = "random"
