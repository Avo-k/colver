# Même sonde que tb_cheapest, mais avec l'enchère RÉALISTE (v6) au lieu de improved_v2 :
# contrats jusqu'à 250 et 4-5 annonces par enchère, contre un plafond à 120 et 41 %
# d'enchères à une seule annonce. Contrôle de robustesse de la mesure du §10.
[bid]
strategy = "nn"
model = "models/bid_v6_isdd_resume/bid_nn_final.bin"
hidden = 512
score_aware = true

[play]
method = "oracle_dd"
tiebreak = "cheapest"
