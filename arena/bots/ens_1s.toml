# Ensemble world pool: 30% playgen v2 + belief-weighted + uniform floor,
# all worlds credibility-weighted by bid v6 auction replay (alpha 0.5).
[bid]
strategy = "nn"
model = "models/bid_v6_isdd_resume/bid_nn_final.bin"
hidden = 512
score_aware = true

[play]
method = "smart_is_dd"
determinizations = 10000
time_ms = 1000
playgen_model = "models/playgen_v2/playgen_v2_half.bin"
playgen_frac = 0.3
playgen_temp = 0.8
belief_frac = 0.8
cred_alpha = 0.5

[belief]
model = "models/belief_v4_fix_v2.bin"
