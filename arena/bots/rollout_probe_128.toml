# Annoncer en simulant la donne — la simulation de la page Annonces, en bidder.
#
# **Le témoin est `v6_isdd_75M`** : même réseau d'enchère, même joueur de
# cartes, sans la simulation. Ce h2h-là mesure la simulation et rien d'autre.
#
# 128 mondes : le point bas, pour voir la pente du budget.
[bid]
strategy = "rollout"
model = "models/bid_v6_isdd_resume/bid_nn_final.bin"
hidden = 512
score_aware = true
sims = 128
candidates = 5
candidate_mode = "probe"
# parallel = false : en arène les matchs saturent déjà les cœurs. Le web, lui,
# doit le mettre à true — c'est là que la latence d'un coup se voit.

[play]
method = "dmc"
model = "models/play_v2/play_final.bin"
residual = true

[worlds]
source = "sidecar"
# ⚠️ **Le sidecar sérialise `/auction_deals`** (`run_alone` : ces requêtes ne
# sont jamais groupées entre elles, contrairement à `/play_worlds`). Avec N
# matchs concurrents, le N-ième attend N × ~1,1 s — le défaut de 6 s expire dès
# ~5 matchs en parallèle, et l'arène s'arrête sur « read: Resource temporarily
# unavailable ». Le délai doit donc couvrir la file, pas la requête.
timeout_ms = 120000
