# v6 ISDD final + IS-DD play + belief net (challenger to nn_v2_isdd "best overall")
[bid]
strategy = "nn"
model = "models/bid_v6_isdd_resume/bid_nn_final.bin"
hidden = 512
score_aware = true

[play]
method = "smart_is_dd"
time_ms = 50
determinizations = 20

[belief]
model = "models/belief_v3.bin"
use_hard_constraints = true
