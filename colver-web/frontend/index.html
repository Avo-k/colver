<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colver - Belote Contree</title>
    <base href="/colver/">
    <link rel="stylesheet" href="static/styles.css">
</head>
<body>
    <header>
        <h1>COLVER</h1>
        <nav>
            <button class="tab active" data-tab="play">Jouer</button>
            <button class="tab" data-tab="watch">Regarder</button>
            <button class="tab" data-tab="analysis">Analyse</button>
        </nav>
    </header>

    <main>
        <!-- PLAY MODE -->
        <div id="play-panel" class="panel active">
            <div id="play-config">
                <label>Adversaires :
                    <select id="opponent-ai">
                        <option value="doudou">DouDou</option>
                        <option value="smart">Smart IS-MCTS</option>
                        <option value="naive">Naive IS-MCTS</option>
                        <option value="oracle">Oracle (MCTS)</option>
                    </select>
                </label>
                <label>Partenaire :
                    <select id="partner-ai">
                        <option value="doudou">DouDou</option>
                        <option value="smart">Smart IS-MCTS</option>
                        <option value="naive">Naive IS-MCTS</option>
                        <option value="oracle">Oracle (MCTS)</option>
                    </select>
                </label>
                <button id="start-game">Nouvelle Partie</button>
            </div>

            <div id="play-table" class="table hidden">
                <div id="score-bar">
                    <span id="score-ns">NS : 0</span>
                    <span id="contract-display"></span>
                    <span id="score-ew">EO : 0</span>
                </div>

                <div class="seats">
                    <div class="seat north" id="seat-north">
                        <div class="seat-label">Nord (Partenaire)</div>
                        <div class="hand" id="hand-north"></div>
                    </div>
                    <div class="seat west" id="seat-west">
                        <div class="seat-label">Ouest</div>
                        <div class="hand" id="hand-west"></div>
                    </div>
                    <div id="trick-area">
                        <div class="trick-card" id="trick-n"></div>
                        <div class="trick-card" id="trick-w"></div>
                        <div class="trick-card" id="trick-e"></div>
                        <div class="trick-card" id="trick-s"></div>
                    </div>
                    <div class="seat east" id="seat-east">
                        <div class="seat-label">Est</div>
                        <div class="hand" id="hand-east"></div>
                    </div>
                    <div class="seat south" id="seat-south">
                        <div class="seat-label">Sud (Vous)</div>
                        <div class="hand" id="hand-south"></div>
                    </div>
                </div>

                <div id="last-trick" class="hidden"></div>

                <div id="bidding-panel" class="hidden">
                    <div id="bid-history"></div>
                    <div id="bid-controls">
                        <div id="bid-selectors">
                            <select id="bid-value">
                                <option value="">Valeur...</option>
                                <option value="80">80</option>
                                <option value="90">90</option>
                                <option value="100">100</option>
                                <option value="110">110</option>
                                <option value="120">120</option>
                                <option value="130">130</option>
                                <option value="140">140</option>
                                <option value="150">150</option>
                                <option value="160">160</option>
                                <option value="250">Capot</option>
                            </select>
                            <select id="bid-suit">
                                <option value="0">&spades; Pique</option>
                                <option value="1">&hearts; Coeur</option>
                                <option value="2">&diams; Carreau</option>
                                <option value="3">&clubs; Trefle</option>
                            </select>
                            <button id="bid-submit" class="bid-btn bid-action">Annoncer</button>
                        </div>
                        <div id="bid-special">
                            <button id="bid-pass" class="bid-btn pass">Passe</button>
                            <button id="bid-coinche" class="bid-btn coinche hidden">Coinche</button>
                            <button id="bid-surcoinche" class="bid-btn coinche hidden">Surcoinche</button>
                        </div>
                    </div>
                </div>

                <div id="game-result" class="hidden"></div>
                <div id="play-status"></div>
            </div>
        </div>

        <!-- WATCH MODE -->
        <div id="watch-panel" class="panel">
            <div id="watch-config">
                <div class="watch-agents">
                    <label>N : <select class="agent-select" data-seat="0">
                        <option value="doudou">DouDou</option>
                        <option value="smart">Smart IS-MCTS</option>
                        <option value="naive">Naive IS-MCTS</option>
                        <option value="oracle">Oracle (MCTS)</option>
                        <option value="heuristic">Heuristique</option>
                        <option value="random">Aleatoire</option>
                    </select></label>
                    <label>E : <select class="agent-select" data-seat="1">
                        <option value="doudou">DouDou</option>
                        <option value="smart">Smart IS-MCTS</option>
                        <option value="naive">Naive IS-MCTS</option>
                        <option value="oracle">Oracle (MCTS)</option>
                        <option value="heuristic">Heuristique</option>
                        <option value="random">Aleatoire</option>
                    </select></label>
                    <label>S : <select class="agent-select" data-seat="2">
                        <option value="doudou">DouDou</option>
                        <option value="smart">Smart IS-MCTS</option>
                        <option value="naive">Naive IS-MCTS</option>
                        <option value="oracle">Oracle (MCTS)</option>
                        <option value="heuristic">Heuristique</option>
                        <option value="random">Aleatoire</option>
                    </select></label>
                    <label>O : <select class="agent-select" data-seat="3">
                        <option value="doudou">DouDou</option>
                        <option value="smart">Smart IS-MCTS</option>
                        <option value="naive">Naive IS-MCTS</option>
                        <option value="oracle">Oracle (MCTS)</option>
                        <option value="heuristic">Heuristique</option>
                        <option value="random">Aleatoire</option>
                    </select></label>
                </div>
                <button id="watch-start">Lancer</button>
            </div>

            <div id="watch-main" class="hidden">
                <div id="watch-left">
                    <div id="watch-score-bar">
                        <span id="watch-score-ns">NS : 0</span>
                        <span id="watch-contract-display"></span>
                        <span id="watch-score-ew">EO : 0</span>
                    </div>

                    <div class="seats">
                        <div class="seat north">
                            <div class="seat-label" id="watch-label-n">Nord</div>
                            <div class="hand" id="watch-hand-north"></div>
                        </div>
                        <div class="seat west">
                            <div class="seat-label" id="watch-label-w">Ouest</div>
                            <div class="hand" id="watch-hand-west"></div>
                        </div>
                        <div id="watch-trick-area">
                            <div class="trick-card" id="watch-trick-n"></div>
                            <div class="trick-card" id="watch-trick-w"></div>
                            <div class="trick-card" id="watch-trick-e"></div>
                            <div class="trick-card" id="watch-trick-s"></div>
                        </div>
                        <div class="seat east">
                            <div class="seat-label" id="watch-label-e">Est</div>
                            <div class="hand" id="watch-hand-east"></div>
                        </div>
                        <div class="seat south">
                            <div class="seat-label" id="watch-label-s">Sud</div>
                            <div class="hand" id="watch-hand-south"></div>
                        </div>
                    </div>

                    <div id="watch-last-trick" class="hidden"></div>
                </div>

                <div id="watch-right">
                    <div id="watch-transport">
                        <button id="watch-step-btn" title="Prochain coup">&#9654;|</button>
                        <button id="watch-trick-btn" title="Jouer le pli">&#9654;&#9654;</button>
                        <button id="watch-auto-btn" title="Auto-play">&#9654;</button>
                        <button id="watch-end-btn" title="Fin de partie">&#9654;&#9654;|</button>
                        <label class="speed-label">Vitesse :
                            <input type="range" id="watch-speed" min="100" max="2000" value="500" step="100">
                            <span id="watch-speed-val">500</span>ms
                        </label>
                    </div>

                    <div id="watch-stats-panel">
                        <div id="watch-stats-header"></div>
                        <div id="watch-stats-body"></div>
                    </div>

                    <div id="watch-bid-history">
                        <div class="section-title">Encheres</div>
                        <div id="watch-bid-entries"></div>
                    </div>

                    <div id="watch-tricks-history">
                        <div class="section-title">Plis</div>
                        <div id="watch-tricks-list"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ANALYSIS MODE -->
        <div id="analysis-panel" class="panel">
            <div id="analysis-config">
                <h3>Configurer la position</h3>
                <div id="hand-editor">
                    <div class="hand-edit-row">
                        <label>Joueur :
                            <select id="edit-player">
                                <option value="0">Nord</option>
                                <option value="1">Est</option>
                                <option value="2">Sud</option>
                                <option value="3">Ouest</option>
                            </select>
                        </label>
                    </div>
                    <div id="card-palette"></div>
                    <div id="assigned-cards"></div>
                </div>
                <div id="contract-editor">
                    <label>Atout :
                        <select id="analysis-trump">
                            <option value="0">&#9824; Pique</option>
                            <option value="1">&#9829; Coeur</option>
                            <option value="2">&#9830; Carreau</option>
                            <option value="3">&#9827; Trefle</option>
                        </select>
                    </label>
                    <label>Valeur :
                        <select id="analysis-value">
                            <option value="80">80</option>
                            <option value="90">90</option>
                            <option value="100">100</option>
                            <option value="110">110</option>
                            <option value="120">120</option>
                            <option value="130">130</option>
                            <option value="140">140</option>
                            <option value="150">150</option>
                            <option value="160">160</option>
                            <option value="250">Capot</option>
                        </select>
                    </label>
                    <label>Equipe :
                        <select id="analysis-team">
                            <option value="0">NS</option>
                            <option value="1">EO</option>
                        </select>
                    </label>
                </div>
                <button id="random-deal">Donne aleatoire</button>
                <button id="setup-analysis">Valider la position</button>
            </div>

            <div id="analysis-table" class="table hidden">
                <div class="seats">
                    <div class="seat north"><div class="seat-label">Nord</div><div class="hand" id="analysis-hand-north"></div></div>
                    <div class="seat west"><div class="seat-label">Ouest</div><div class="hand" id="analysis-hand-west"></div></div>
                    <div id="analysis-trick-area">
                        <div class="trick-card" id="analysis-trick-n"></div>
                        <div class="trick-card" id="analysis-trick-w"></div>
                        <div class="trick-card" id="analysis-trick-e"></div>
                        <div class="trick-card" id="analysis-trick-s"></div>
                    </div>
                    <div class="seat east"><div class="seat-label">Est</div><div class="hand" id="analysis-hand-east"></div></div>
                    <div class="seat south"><div class="seat-label">Sud</div><div class="hand" id="analysis-hand-south"></div></div>
                </div>
                <div id="analysis-controls">
                    <label>Agent :
                        <select id="analysis-agent">
                            <option value="naive">Naive IS-MCTS</option>
                            <option value="smart">Smart IS-MCTS</option>
                        </select>
                    </label>
                    <label>Temps (ms) :
                        <input type="range" id="analysis-time" min="50" max="2000" value="200" step="50">
                        <span id="analysis-time-val">200</span>
                    </label>
                    <button id="run-analysis">Analyser</button>
                </div>
                <div id="analysis-result"></div>
            </div>
        </div>
    </main>

    <script src="static/js/main.js"></script>
    <script src="static/js/play.js"></script>
    <script src="static/js/watch.js"></script>
    <script src="static/js/analysis.js"></script>
</body>
</html>
