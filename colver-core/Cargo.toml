[package]
name = "colver-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["rand"]
rand = ["dep:rand"]
parallel = ["dep:rayon", "rand"]
nn = ["rand"]
dmc_train = ["rand", "dep:candle-core", "dep:candle-nn", "dep:clap"]

[dependencies]
rand = { version = "0.8", optional = true }
rayon = { version = "1.10", optional = true }
candle-core = { version = "0.9", optional = true, features = ["cuda"] }
candle-nn = { version = "0.9", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }

[dev-dependencies]
rand = "0.8"

[[bin]]
name = "bench"
path = "src/tests/bench.rs"

[[bin]]
name = "mcts_demo"
