[package]
name = "colver-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["rand"]
rand = ["dep:rand"]
parallel = ["dep:rayon", "rand"]
# candle + le transformer playgen et son inférence CUDA, SANS le code d'entraînement.
# Le sidecar n'a jamais eu besoin des modules `*_candle` ni de `gpu_rollout` :
# `playgen/{gpu,model}.rs` ne les référencent nulle part (vérifié), ils ne partagent
# que la dépendance candle — et pas même clap. Les avoir mis sur le même drapeau
# imposait de compiler 2 787 lignes d'entraînement pour servir des mondes.
#
# Ça sert aussi le miroir public : lui retirer le code d'entraînement cassait
# `--features gpu_server` (4 × E0583), parce que `gpu_server` tirait `dmc_train`.
playgen_gpu = ["rand", "dep:candle-core", "dep:candle-nn"]
dmc_train = ["playgen_gpu", "dep:clap"]
gpu_server = ["playgen_gpu", "dep:tiny_http", "dep:serde", "dep:serde_json"]
# Count alpha-beta nodes in the DD solver. Off by default: a node is only ~29 ns, so the
# thread-local increment is not free. On a hybrid P/E-core CPU wall-clock alone cannot
# separate "better pruning" from "landed on a P-core", so every solver benchmark needs this.
solver_stats = []
# Runtime switches that turn off PVS / killer moves / history in the DD solver, driven by
# COLVER_DD_NO_{PVS,KILLERS,HISTORY}. Off by default and compiled out entirely: it exists so
# the ablation configurations can share one binary, one corpus and one codegen. Never enable
# in production — `solver::ablation_label()` says which heuristics a run actually had.
solver_ablation = []
# Runtime switch turning off the belote deduction (`play::belote_facts`), driven by
# COLVER_NO_BELOTE_FACTS=1. Off by default and compiled out: it exists so an A/B can share one
# binary and one corpus, since the deduction is a fact of the rules and has no production knob.
belief_ablation = []
# Records the best move at every node into an eviction-free map so a second solve can replay
# the position perfectly ordered — the ceiling on any move-ordering heuristic. Off by default
# and compiled out; the map is per-thread and can reach hundreds of MB on a hard full deal.
solver_oracle = []

[dependencies]
rand = { version = "0.8", optional = true }
rayon = { version = "1.10", optional = true }
candle-core = { version = "0.9", optional = true, features = ["cuda"] }
candle-nn = { version = "0.9", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
tiny_http = { version = "0.12", optional = true }
serde = { version = "1", optional = true, features = ["derive"] }
serde_json = { version = "1", optional = true }

[dev-dependencies]
rand = "0.8"

# Binaries without required-features are auto-discovered from src/bin/
# Only entries with required-features need explicit declaration.



