[package]
name = "colver-core"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["rand"]
rand = ["dep:rand"]
parallel = ["dep:rayon", "rand"]
nn = ["rand"]
dmc_train = ["rand", "dep:candle-core", "dep:candle-nn", "dep:clap"]
tch_train = ["rand", "dep:tch", "dep:clap"]

[dependencies]
rand = { version = "0.8", optional = true }
rayon = { version = "1.10", optional = true }
candle-core = { version = "0.9", optional = true, features = ["cuda"] }
candle-nn = { version = "0.9", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }
tch = { version = "0.23", optional = true, features = ["download-libtorch"] }

[dev-dependencies]
rand = "0.8"

# Binaries without required-features are auto-discovered from src/bin/
# Only entries with required-features need explicit declaration.

[[bin]]
name = "generate_value_data"
path = "src/bin/generate_value_data.rs"
required-features = ["nn"]

[[bin]]
name = "nn_experiment"
path = "src/bin/nn_experiment.rs"
required-features = ["nn"]

[[bin]]
name = "train_dmc"
path = "src/bin/train_dmc.rs"
required-features = ["dmc_train"]

[[bin]]
name = "train_bid_nn"
path = "src/bin/train_bid_nn.rs"
required-features = ["dmc_train"]

[[bin]]
name = "train_joint"
path = "src/bin/train_joint.rs"
required-features = ["dmc_train"]

[[bin]]
name = "train_playgen"
path = "src/bin/train_playgen.rs"
