[package]
name = "colver-core"
version = "0.1.0"
edition = "2021"

[features]
default = ["rand"]
rand = ["dep:rand"]
parallel = ["dep:rayon", "rand"]
nn = ["rand"]
dmc_train = ["rand", "dep:candle-core", "dep:candle-nn", "dep:clap"]

[dependencies]
rand = { version = "0.8", optional = true }
rayon = { version = "1.10", optional = true }
candle-core = { version = "0.9", optional = true, features = ["cuda"] }
candle-nn = { version = "0.9", optional = true }
clap = { version = "4", optional = true, features = ["derive"] }

[dev-dependencies]
rand = "0.8"

[[bin]]
name = "bench"
path = "src/tests/bench.rs"

[[bin]]
name = "mcts_demo"
path = "src/tests/mcts_demo.rs"

[[bin]]
name = "ismcts_demo"
path = "src/tests/ismcts_demo.rs"

[[bin]]
name = "smart_ismcts_demo"
path = "src/tests/smart_ismcts_demo.rs"

[[bin]]
name = "bidding_experiment"
path = "src/tests/bidding_experiment.rs"

[[bin]]
name = "bid_analysis"
path = "src/tests/bid_analysis.rs"

[[bin]]
name = "oracle_experiment"
path = "src/tests/oracle_experiment.rs"

[[bin]]
name = "single_tree_ismcts_demo"
path = "src/tests/single_tree_ismcts_demo.rs"

[[bin]]
name = "strength_experiment"
path = "src/tests/strength_experiment.rs"

[[bin]]
name = "diagnose_smart"
path = "src/tests/diagnose_smart.rs"

[[bin]]
name = "match_experiment"
path = "src/tests/match_experiment.rs"

[[bin]]
name = "bid_debug"
path = "src/tests/bid_debug.rs"

[[bin]]
name = "bid_tournament"
path = "src/tests/bid_tournament.rs"

[[bin]]
name = "generate_value_data"
path = "src/tests/generate_value_data.rs"
required-features = ["nn"]

[[bin]]
name = "nn_experiment"
path = "src/tests/nn_experiment.rs"
required-features = ["nn"]

[[bin]]
name = "agent_tournament"
path = "src/tests/agent_tournament.rs"

[[bin]]
name = "v2_tournament"
path = "src/tests/v2_tournament.rs"

[[bin]]
name = "train_dmc"
path = "src/tests/train_dmc.rs"
required-features = ["dmc_train"]
