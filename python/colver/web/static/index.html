<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colver - Belote Contree</title>
    <base href="/">
    <link rel="icon" type="image/x-icon" href="static/favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="static/favicon-32.png">
    <link rel="apple-touch-icon" href="static/apple-touch-icon.png">
    <link rel="stylesheet" href="static/css/tokens.css">
    <link rel="stylesheet" href="static/css/base.css">
    <link rel="stylesheet" href="static/css/layout.css">
    <link rel="stylesheet" href="static/css/cards.css">
    <link rel="stylesheet" href="static/css/board.css">
    <link rel="stylesheet" href="static/css/bidding.css">
    <link rel="stylesheet" href="static/css/game.css">
    <link rel="stylesheet" href="static/css/watch.css">
    <link rel="stylesheet" href="static/css/tools.css">
    <link rel="stylesheet" href="static/css/score.css">
    <link rel="stylesheet" href="static/css/modals.css">
    <link rel="stylesheet" href="static/css/animations.css">
</head>
<body>
    <header>
        <a href="/" class="header-logo">COLVER</a>
        <button id="nav-toggle" class="nav-toggle" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">&#9776;</button>
        <!-- 4 destinations de premier niveau au lieu de 13. Les pages de
             r&eacute;f&eacute;rence (Aide, Annoncer, Marquer) sont des m&eacute;mos, pas des
             modes de jeu : elles vivent sous « Apprendre ». Les probl&egrave;mes
             sont un sous-groupe d'« Analyser ». -->
        <nav id="site-nav">
            <div class="nav-main">
                <div class="nav-group">
                    <button type="button" class="nav-label">Jouer<span class="nav-caret">&#9662;</span></button>
                    <div class="nav-dropdown">
                        <a class="nav-item" data-route="/jouer/humain" href="/jouer/humain">Humain vs IA</a>
                        <a class="nav-item" data-route="/jouer/salon" href="/jouer/salon">Salon multijoueur</a>
                        <a class="nav-item" data-route="/jouer/ia" href="/jouer/ia">IA vs IA</a>
                    </div>
                </div>
                <div class="nav-group">
                    <button type="button" class="nav-label">Analyser<span class="nav-caret">&#9662;</span></button>
                    <div class="nav-dropdown">
                        <a class="nav-item" data-route="/analyse/rejouer" href="/analyse/rejouer">Rejouer une partie</a>
                        <a class="nav-item" data-route="/analyse/annonces" href="/analyse/annonces">Annonces</a>
                        <a class="nav-item" data-route="/analyse/croyances" href="/analyse/croyances">Croyances</a>
                        <div class="nav-section">S'entra&icirc;ner</div>
                        <a class="nav-item" data-route="/problemes/annonce" href="/problemes/annonce">Probl&egrave;mes d'annonce</a>
                        <a class="nav-item" data-route="/problemes/jeu" href="/problemes/jeu">Probl&egrave;mes de jeu</a>
                    </div>
                </div>
                <div class="nav-group">
                    <button type="button" class="nav-label">Apprendre<span class="nav-caret">&#9662;</span></button>
                    <div class="nav-dropdown">
                        <a class="nav-item" data-route="/aide" href="/aide">Aide-m&eacute;moire</a>
                        <a class="nav-item" data-route="/annoncer" href="/annoncer">Guide des annonces</a>
                        <a class="nav-item" data-route="/score" href="/score">Marquer les points</a>
                    </div>
                </div>
                <a class="nav-link" data-route="/classement" href="/classement">Classement</a>
            </div>
            <div class="nav-end">
                <button id="sound-toggle" class="sound-toggle" title="Son on/off">&#128266;</button>
                <div class="nav-group nav-group--end">
                    <button type="button" class="nav-label" id="nav-account">Compte<span class="nav-caret">&#9662;</span></button>
                    <div class="nav-dropdown nav-dropdown--right">
                        <a class="nav-item" data-route="/compte" href="/compte">Mon compte</a>
                        <a class="nav-item" data-route="/about" href="/about">&Agrave; propos</a>
                    </div>
                </div>
            </div>
        </nav>
    </header>

    <main id="app"></main>

    <!-- Bug report modal -->
    <div id="report-modal" class="modal hidden">
        <div class="modal-content">
            <div class="modal-title">Signaler un bug</div>
            <div id="report-game-label" class="report-game-label"></div>
            <textarea id="report-message" rows="4" placeholder="Decrivez le probleme..."></textarea>
            <div class="modal-buttons">
                <button id="report-cancel" class="modal-btn cancel">Annuler</button>
                <button id="report-submit" class="modal-btn submit">Envoyer</button>
            </div>
            <div id="report-status"></div>
        </div>
    </div>

    <script type="module" src="static/js/app.js"></script>
</body>
</html>
