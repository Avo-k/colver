[project]
name = "colver"
version = "0.9.1"
description = "Fast Belote Contree game engine with AI agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["belote", "card-game", "reinforcement-learning", "mcts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "matplotlib>=3.5",
    "runpod>=1.8.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
    "bcrypt>=4.0",
]
dev = [
    "colver[web]",
    "torch>=2.0",
    "maturin>=1.0,<2.0",
]

[project.scripts]
colver-web = "colver.web:main"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "colver._colver"
manifest-path = "colver-py/Cargo.toml"
python-source = "python"

[tool.uv]
# Local dev installs all extras
default-groups = ["dev"]

[dependency-groups]
dev = [
    "colver[web]",
    "torch>=2.0",
    "maturin>=1.0,<2.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "xgboost>=3.2.0",
    "shap>=0.49.1",
    "matplotlib>=3.10.8",
    {include-group = "test"},
]
# Séparé de `dev` : la CI installe *ce* groupe, pas torch et scikit-learn.
test = [
    "colver[web]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",       # requis par fastapi.testclient
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests du serveur sont asynchrones de bout en bout ; sans ce mode il
# faudrait décorer chaque coroutine, et un décorateur oublié fait *passer* le
# test sans rien exécuter — le pire mode d'échec possible pour une suite.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Pas de warnings-as-errors pour l'instant : `server.py` utilise encore
# `@app.on_event`, déprécié par FastAPI (le passage à `lifespan` est prévu avec
# le drain, cf. docs/web_todo.md §2.6). Une règle qui échoue dès l'import ne
# dirait rien de plus que ce qui est déjà noté.

[tool.ruff]
# Le code du site est écrit large (chaînes SQL, messages en clair) ; on cadre
# sans reformater l'existant.
line-length = 110
target-version = "py310"
extend-exclude = ["scripts", "python/colver/_colver.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4"]
ignore = [
    "E501",   # longueur de ligne : le linter la mesure, il ne la corrige pas
    "B008",   # Depends() en valeur par défaut, l'idiome FastAPI
]

[tool.ruff.lint.per-file-ignores]
# `server.py` résout ses modèles au niveau module, entre deux blocs de
# configuration commentés : l'ordre est le sujet, pas un oubli.
"python/colver/web/server.py" = ["E402"]
# `conftest.py` neutralise les téléchargements de modèles *avant* d'importer
# quoi que ce soit du site — c'est tout l'intérêt du placement.
"tests/conftest.py" = ["E402"]
