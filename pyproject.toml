[project]
name = "colver"
version = "0.10.1"
description = "Fast Belote Contree game engine with AI agents"
# Le README par défaut du dépôt est en français (`README.md`) : c'est la langue du
# site et des joueurs. La fiche PyPI, elle, s'adresse à qui installe le paquet —
# elle reste en anglais. Les deux fichiers sont tenus en parallèle.
readme = "README.en.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
keywords = ["belote", "card-game", "reinforcement-learning", "mcts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Le strict nécessaire pour `pip install colver`. Rien d'autre : la roue ne livre
# que `python/colver/`, donc ce que les scripts du dépôt importent n'a pas à être
# imposé à qui veut seulement charger un modèle. `matplotlib` (4 scripts de tracé)
# et `runpod` (un script de location de GPU) étaient ici et tiraient à eux seuls
# 103 paquets / 296 Mo, dont fastapi[all], boto3 et paramiko via runpod — contre
# 19 paquets / 94 Mo sans eux, à comportement identique. Ils vivent en groupe dev.
#
# `numpy` reste obligatoire : sans lui l'extension ne panique pas à l'import mais
# au premier appel qui rend un tableau (`legal_action_mask`), ce qui est pire.
# `huggingface_hub` l'est aussi depuis la 0.10 : les poids sont sur le Hub et
# `download_*` les rapatrie sans que l'utilisateur ait rien à installer de plus
# (+15 paquets, +23 Mo — on reste à 94 Mo contre 296 avant l'élagage). Le repli
# GitHub Releases survit à son absence, mais on ne veut pas en dépendre.
# `sentry-sdk` reste volontairement absent — cf. `web/server.py`.
dependencies = [
    "numpy",
    "huggingface_hub>=0.30",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
    "bcrypt>=4.0",
]

[project.scripts]
colver-web = "colver.web:main"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "colver._colver"
manifest-path = "colver-py/Cargo.toml"
python-source = "python"

[tool.uv]
# Local dev installs all extras
default-groups = ["dev"]

[dependency-groups]
dev = [
    "colver[web]",
    "torch>=2.0",
    "maturin>=1.0,<2.0",
    "pandas>=2.3.3",
    "scikit-learn>=1.7.2",
    "xgboost>=3.2.0",
    "shap>=0.49.1",
    "matplotlib>=3.10.8",   # scripts/analysis/ : tracés et SHAP
    "runpod>=1.8.1",        # scripts/training/runpod_race.py, location de GPU
    {include-group = "test"},
]
# Séparé de `dev` : la CI installe *ce* groupe, pas torch et scikit-learn.
test = [
    "colver[web]",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",       # requis par fastapi.testclient
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Les tests du serveur sont asynchrones de bout en bout ; sans ce mode il
# faudrait décorer chaque coroutine, et un décorateur oublié fait *passer* le
# test sans rien exécuter — le pire mode d'échec possible pour une suite.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Pas de warnings-as-errors pour l'instant : `server.py` utilise encore
# `@app.on_event`, déprécié par FastAPI (le passage à `lifespan` est prévu avec
# le drain, cf. docs/web_todo.md §2.6). Une règle qui échoue dès l'import ne
# dirait rien de plus que ce qui est déjà noté.

[tool.ruff]
# Le code du site est écrit large (chaînes SQL, messages en clair) ; on cadre
# sans reformater l'existant.
line-length = 110
target-version = "py310"
extend-exclude = ["scripts", "python/colver/_colver.pyi"]

[tool.ruff.lint]
select = ["E", "F", "W", "B", "UP", "C4"]
ignore = [
    "E501",   # longueur de ligne : le linter la mesure, il ne la corrige pas
    "B008",   # Depends() en valeur par défaut, l'idiome FastAPI
]

[tool.ruff.lint.per-file-ignores]
# `server.py` résout ses modèles au niveau module, entre deux blocs de
# configuration commentés : l'ordre est le sujet, pas un oubli.
"python/colver/web/server.py" = ["E402"]
# `conftest.py` neutralise les téléchargements de modèles *avant* d'importer
# quoi que ce soit du site — c'est tout l'intérêt du placement.
"tests/conftest.py" = ["E402"]
