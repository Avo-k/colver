[project]
name = "colver"
version = "0.1.0"
description = "Fast Belote Contrée environment for RL training"
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.129.0",
    "uvicorn[standard]>=0.40.0",
    "websockets>=16.0",
    "aiosqlite>=0.20.0",
]
torch = [
    "torch>=2.0",
]
dev = [
    "colver[web,torch]",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "colver-py/Cargo.toml"
python-source = "python"

[tool.uv]
# Local dev installs all extras
default-groups = ["dev"]

[dependency-groups]
dev = [
    "colver[web,torch]",
    "maturin>=1.0,<2.0",
    "websockets>=16.0",
]
