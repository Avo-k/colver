[project]
name = "colver"
version = "0.1.0"
description = "Fast Belote Contrée environment for RL training"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "colver-py/Cargo.toml"
python-source = "python"
