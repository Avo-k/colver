[project]
name = "colver"
version = "0.3.3"
description = "Fast Belote Contree game engine with AI agents"
readme = "README.md"
license = { text = "WTFPL" }
requires-python = ">=3.10"
keywords = ["belote", "card-game", "reinforcement-learning", "mcts"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Games/Entertainment :: Board Games",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy",
    "matplotlib>=3.5",
    "runpod>=1.8.1",
]

[project.optional-dependencies]
web = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "websockets>=12.0",
    "aiosqlite>=0.20.0",
]
dev = [
    "colver[web]",
    "torch>=2.0",
    "maturin>=1.0,<2.0",
]

[project.scripts]
colver-web = "colver.web:main"

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
module-name = "colver._colver"
manifest-path = "colver-py/Cargo.toml"
python-source = "python"

[tool.uv]
# Local dev installs all extras
default-groups = ["dev"]

[dependency-groups]
dev = [
    "colver[web]",
    "torch>=2.0",
    "maturin>=1.0,<2.0",
]
