[project]
name = "colver"
version = "0.1.0"
description = "Fast Belote Contrée environment for RL training"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.129.0",
    "numpy",
    "uvicorn[standard]>=0.40.0",
    "websockets>=16.0",
]

[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[tool.maturin]
manifest-path = "colver-py/Cargo.toml"
python-source = "python"
