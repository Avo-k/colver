<line class="grid" x1="62" y1="96" x2="62" y2="416"/>
<text class="t3" x="24" y="474" font-size="11.5">Les preneurs annoncent 110-120 quand le jeu parfait en offre 140 — et convertissent 8,9 % de capots sur les 15,4 % disponibles.</text>
<text class="t3" x="24" y="491" font-size="10.5">Donnes sous 60 points exclues (~3 %). Au-delà de 160, plus aucune annonce : l'échelle s'arrête là où le jeu s'arrête.</text>
