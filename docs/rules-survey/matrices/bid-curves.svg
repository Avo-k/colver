<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 500" width="880" height="500" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Distribution des contrats annoncés, des points faits et des points atteignables en jeu parfait">
<style>
  .surface{fill:#fcfcfb}.band{fill:#f2f1ed}
