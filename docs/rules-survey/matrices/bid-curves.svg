</style>
<rect class="surface" width="880" height="500"/>
<text class="t1" x="24" y="36" font-size="16" font-weight="600">Ce qui est annoncé, ce qui est fait, ce qui était là</text>
<text class="t2" x="24" y="57" font-size="12.5">60 000 donnes jouées — mêmes donnes, même camp preneur, même atout</text>
