<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 452" width="880" height="452" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" role="img" aria-label="Fréquence des paliers d'enchère 170 et 180 comparée au capot">
<style>
  .surface{fill:#fcfcfb}
  .t1{fill:#0b0b0b}.t2{fill:#52514e}.t3{fill:#7a7973}
  .grid{stroke:#e6e5e1;stroke-width:1}
  .s0{fill:#2a78d6}.s1{fill:#eb6834}.s2{fill:#1baf7a}
  @media (prefers-color-scheme:dark){
    .surface{fill:#1a1a19}
    .t1{fill:#ffffff}.t2{fill:#c3c2b7}.t3{fill:#8f8e85}
    .grid{stroke:#333330}
    .s0{fill:#3987e5}.s1{fill:#d95926}.s2{fill:#199e70}
  }
</style>
<rect class="surface" width="880" height="452"/>
<text class="t1" x="24" y="34" font-size="16" font-weight="600">Ouvrir l'échelle d'enchères au-dessus de 160 : ce que ça ajouterait</text>
<text class="t2" x="24" y="55" font-size="12.5">% de donnes où le meilleur atout d'un camp atteint la tranche — 5 000 000 donnes</text>
<rect class="s0" x="24" y="70" width="9" height="9" rx="2"/>
<text class="t2" x="39" y="79" font-size="12">DD — jeu parfait</text>
<rect class="s1" x="166.6" y="70" width="9" height="9" rx="2"/>
<text class="t2" x="181.6" y="79" font-size="12">DouDou (DMC)</text>
<rect class="s2" x="282.79999999999995" y="70" width="9" height="9" rx="2"/>
<text class="t2" x="297.79999999999995" y="79" font-size="12">IS-DD</text>
<line class="grid" x1="150.0" y1="86" x2="150.0" y2="406"/>
<text class="t3" x="150.0" y="424" font-size="11.5" text-anchor="middle">0 %</text>
<line class="grid" x1="339.4" y1="86" x2="339.4" y2="406"/>
<text class="t3" x="339.4" y="424" font-size="11.5" text-anchor="middle">5 %</text>
<line class="grid" x1="528.8" y1="86" x2="528.8" y2="406"/>
<text class="t3" x="528.8" y="424" font-size="11.5" text-anchor="middle">10 %</text>
<line class="grid" x1="718.2" y1="86" x2="718.2" y2="406"/>
<text class="t3" x="718.2" y="424" font-size="11.5" text-anchor="middle">15 %</text>
<text class="t1" x="134" y="129.5" font-size="12.5" text-anchor="end" font-weight="500">capot réalisé</text>
<path class="s0" d="M150,96 H754.9967058823529 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H150 Z"/>
<text class="t2" x="766.0" y="109.0" font-size="11.5">16,08 %</text>
<path class="s1" d="M150,116 H328.4792941176471 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H150 Z"/>
<text class="t2" x="339.5" y="129.0" font-size="11.5">4,82 %</text>
<path class="s2" d="M150,136 H411.6689411764706 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H150 Z"/>
<text class="t2" x="422.7" y="149.0" font-size="11.5">7,01 %</text>
<text class="t1" x="134" y="211.5" font-size="12.5" text-anchor="end" font-weight="500">160 – 169</text>
<path class="s0" d="M150,178 H235.47811764705884 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H150 Z"/>
<path class="s1" d="M150,198 H203.12658823529412 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H150 Z"/>
<path class="s2" d="M150,218 H229.94729411764706 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H150 Z"/>
<text class="t1" x="134" y="293.5" font-size="12.5" text-anchor="end" font-weight="500">170 – 179</text>
<path class="s0" d="M150,260 H155.09176470588235 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H150 Z"/>
<text class="t2" x="166.1" y="273.0" font-size="11.5">0,240 %</text>
<path class="s1" d="M150,280 H158.8421176470588 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H150 Z"/>
<text class="t2" x="169.8" y="293.0" font-size="11.5">0,339 %</text>
<path class="s2" d="M150,300 H158.88 a4,4 0 0 1 4,4 v10 a4,4 0 0 1 -4,4 H150 Z"/>
<text class="t2" x="169.9" y="313.0" font-size="11.5">0,340 %</text>
<text class="t1" x="134" y="375.5" font-size="12.5" text-anchor="end" font-weight="500">180 et plus</text>
<rect class="s0" x="150" y="342" width="1.60" height="18"/>
<text class="t2" x="158.6" y="355.0" font-size="11.5">0,004 %</text>
<rect class="s1" x="150" y="362" width="1.60" height="18"/>
<text class="t2" x="158.6" y="375.0" font-size="11.5">0,015 %</text>
<rect class="s2" x="150" y="382" width="1.60" height="18"/>
<text class="t2" x="158.6" y="395.0" font-size="11.5">0,013 %</text>
<line class="grid" x1="150" y1="86" x2="150" y2="406"/>
<text class="t3" x="24" y="440" font-size="11.5">Un palier à 180 n'est tenable que dans une donne sur 7 000 — et quand il l'est, le capot l'est presque toujours aussi.</text>
</svg>
